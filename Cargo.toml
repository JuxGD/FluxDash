[package]
name = "fluxdash"
version = "0.3.1"
edition = "2024"
authors = [ "JuxGD <@JuxGD>" ]
description = "Geometry Dash bot for Fluxer! (WIP, contributions appreciated!)"
homepage = "https://codeberg.org/JuxGD/FluxDash"
repository = "https://github.com/JuxGD/FluxDash"
license = "MIT"

[dependencies]
itertools = "0.15.0"
env_logger = "0.11.11"
log = "0.4.34"
fluxer-rs = { git = "https://tangled.org/awoo.ren/fluxer-rs" }
gdutils = "0.4.8"
dotenvy = "0.15.7"
time-hms = "0.3.1"
color-eyre = "0.6.5"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = [ "derive" ] }

[dependencies.tokio]
version = "1.53.3"
features = ["rt-multi-thread", "macros"]